<script>
document.addEventListener("click", function (e) {
  document.querySelectorAll("details[open]").forEach(function (d) {
    if (!d.contains(e.target)) d.open = false;
  });

  var copy = e.target.closest(".copy");
  if (copy) {
    var el = document.getElementById(copy.dataset.copy);
    var text = el.textContent.trim().split("\n").map(function (l) { return l.replace(/^\$ /, ""); }).join("\n");
    var done = function () { copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy"; }, 1600); };
    var fallback = function () {
      var r = document.createRange(); r.selectNodeContents(el);
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      copy.textContent = "Selected";
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (_) { fallback(); }
  }
});
</script>
