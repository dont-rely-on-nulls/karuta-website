<script>
(function () {
    // Colour Karuta source: comments, quoted atoms, variables, operators, atoms.
    var token = /(%.*$)|('[^'\n]*')|(\b[A-Z_][A-Za-z0-9_]*)|(:-|\?|\|)|(\b[a-z][A-Za-z0-9_]*)/gm;
    var kinds = ["k-c", "k-a", "k-v", "k-o", "k-a"];
    var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
    document.querySelectorAll("code.language-karuta").forEach(function (el) {
        var src = el.textContent, out = "", last = 0, m;
        while ((m = token.exec(src))) {
            out += esc(src.slice(last, m.index));
            for (var i = 1; i <= 5; i++) if (m[i] !== undefined) break;
            out += '<span class="' + kinds[i - 1] + '">' + esc(m[0]) + "</span>";
            last = token.lastIndex;
        }
        el.innerHTML = out + esc(src.slice(last));
    });

    // Taking a grabbing card straightens it.
    document.addEventListener("click", function (e) {
        var g = e.target.closest(".grab");
        if (!g) return;
        var on = g.getAttribute("aria-pressed") !== "true";
        g.setAttribute("aria-pressed", on);
        g.querySelector(".grab-cap").textContent = on ? "Taken" : "Take the card";
    });
})();
</script>
